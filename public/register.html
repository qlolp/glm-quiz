<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Викторина</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0c0c0e;
            --bg-secondary: #141618;
            --bg-tertiary: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #9fa0a0;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .logo h1 { font-size: 28px; font-weight: 600; }
        .logo p { color: var(--text-secondary); margin-top: 8px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-input::placeholder { color: var(--text-secondary); }
        .phone-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .country-code {
            padding: 14px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
        }
        .phone-input .form-input { flex: 1; }
        .code-input {
            display: flex;
            gap: 8px;
        }
        .code-digit {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }
        .btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .timer { text-align: center; color: var(--text-secondary); margin: 12px 0; }
        .step { display: none; }
        .step.active { display: block; }
        .success-icon {
            text-align: center;
            font-size: 64px;
            margin-bottom: 16px;
        }
        .success-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .success-text {
            text-align: center;
            color: var(--text-secondary);
        }
        .error { color: #f44336; font-size: 14px; margin-top: 8px; display: none; }
        .error.show { display: block; }
        @media (max-width: 480px) {
            .card { padding: 24px; }
        }
    </style>
    <link rel="stylesheet" href="/css/modern-theme.css">
    <script src="/js/suppress-logs.js"></script>
    <script src="/js/user.js"></script>
    <script src="/js/event-delegation.js"></script>
</head>
<body>
    <div class="card">
        <!-- Step 1: Registration form -->
        <div class="step active" id="step1">
            <div class="logo">
                <div class="logo-icon">📝</div>
                <h1>Регистрация</h1>
                <p>Введите данные для участия в рейтинге</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label class="form-label">Электронная почта</label>
                    <input type="email" class="form-input" id="email" placeholder="ivan@example.com" maxlength="254" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Фамилия Имя Отчество</label>
                    <input type="text" class="form-input" id="fio" placeholder="Иванов Иван Иванович" maxlength="200" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Учреждение (опционально)</label>
                    <input type="text" class="form-input" id="organization" placeholder="ПНИ-9 Санкт-Петербург" maxlength="300">
                </div>

                <button type="submit" class="btn btn-primary">Получить код</button>
                <div class="error" id="error"></div>
            </form>

            <p style="text-align: center; margin-top: 20px; color: var(--text-secondary);">
                Уже есть аккаунт? <a href="/" style="color: var(--accent);">Войти</a>
            </p>
        </div>

        <!-- Step 2: Email code -->
        <div class="step" id="step2">
            <div class="logo">
                <div class="logo-icon">📧</div>
                <h1>Подтверждение</h1>
                <p>Код подтверждения для почты <span id="masked-email"></span>. На семинаре код выдаёт организатор.</p>
            </div>

            <form id="code-form">
                <div class="form-group">
                    <label class="form-label" for="verify-code">Введите код подтверждения</label>
                    <input type="text" class="form-input" id="verify-code" placeholder="6 цифр или код организатора" autocomplete="one-time-code" inputmode="text" maxlength="32">
                </div>

                <div class="timer" id="timer">Код действителен: 5:00</div>

                <button type="submit" class="btn btn-primary">Подтвердить</button>
                <button type="button" class="btn btn-secondary" style="margin-top: 12px;" data-action="resendCode">Отправить повторно</button>
                <div class="error" id="code-error"></div>
            </form>

            <p style="text-align: center; margin-top: 16px;">
                <a href="#" data-action="backToStep1" style="color: var(--accent);">← Назад</a>
            </p>
        </div>

        <!-- Step 3: Success -->
        <div class="step" id="step3">
            <div class="success-icon">🎉</div>
            <div class="success-title">Добро пожаловать!</div>
            <div class="success-text">Вы успешно зарегистрированы</div>
            <a href="/" class="btn btn-secondary" style="display: inline-block; text-align: center; margin-top: 24px; text-decoration: none;">Перейти к викторине</a>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let registrationData = {};
        let timerInterval;
        window.addEventListener('beforeunload', () => clearInterval(timerInterval));

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Step 1: Submit email
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const fio = document.getElementById('fio').value.trim();
            const organization = document.getElementById('organization').value.trim();

            if (!emailRegex.test(email)) {
                showError('Введите корректный email');
                return;
            }
            if (fio.length < 3) {
                showError('Введите ФИО полностью');
                return;
            }

            registrationData = { email, fio, organization };

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registrationData)
                });

                const data = await res.json();

                if (data.success || data.exists) {
                    registrationData.user = data.user;
                    document.getElementById('masked-email').textContent = maskEmail(email);
                    document.getElementById('verify-code').value = '';
                    showStep(2);
                    startTimer();
                    document.getElementById('verify-code').focus();
                } else {
                    showError(data.error || 'Ошибка регистрации');
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError('Не удалось подключиться к серверу. Проверьте интернет и попробуйте снова.');
            }
        });

        // Step 2: Verify code
        document.getElementById('code-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const code = document.getElementById('verify-code').value.trim();

            if (code.length < 6) {
                showCodeError('Введите полный код (минимум 6 символов)');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/auth/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...registrationData, code })
                });

                const data = await res.json();

                if (data.success) {
                    setUserSession(data.user, data.token);
                    showStep(3);
                } else {
                    showCodeError(data.error || 'Неверный код');
                }
            } catch (error) {
                console.error('Verification error:', error);
                showCodeError('Не удалось проверить код. Попробуйте ещё раз.');
            }
        });

        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${stepNum}`).classList.add('active');
        }

        function saveUserToStorage(user) {
            // Legacy key used by gamification, cases, rating pages
            localStorage.setItem('quiz_user', JSON.stringify(user));
            // Keys used by index.html and my-certificates.html
            if (user.id) localStorage.setItem('userId', user.id);
            if (user.username) localStorage.setItem('username', user.username);
            if (user.display_name) localStorage.setItem('userDisplayName', user.display_name);
        }

        function backToStep1() {
            showStep(1);
            clearInterval(timerInterval);
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            el.classList.add('show');
        }

        function showCodeError(msg) {
            const el = document.getElementById('code-error');
            el.textContent = msg;
            el.classList.add('show');
        }

        function maskEmail(email) {
            const [user, domain] = email.split('@');
            if (user.length <= 2) return email;
            return user.slice(0, 2) + '***@' + domain;
        }

        function startTimer() {
            let seconds = 300; // 5 minutes
            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                document.getElementById('timer').textContent = `Код действителен: ${mins}:${secs.toString().padStart(2, '0')}`;

                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timer').textContent = 'Код истёк';
                }
                seconds--;
            }, 1000);
        }

        function resendCode() {
            startTimer();
            alert('Повторная отправка кода на email в демо-режиме не настроена. Используйте код организатора семинара.');
        }

        // Check if already logged in
        const saved = localStorage.getItem('quiz_user');
        if (saved) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
