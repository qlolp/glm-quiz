<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Командный режим — Викторина</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0c0c0e;
            --bg-secondary: #141618;
            --bg-tertiary: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #9fa0a0;
            --border: rgba(255, 255, 255, 0.1);
            --success: #4caf50;
            --error: #f44336;
            --accent: #6366f1;
            --team1: #e74c3c;
            --team2: #3498db;
            --team3: #f1c40f;
            --team4: #9b59b6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }
        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .team-card {
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .team-card.team1 { background: rgba(231, 76, 60, 0.2); border: 2px solid var(--team1); }
        .team-card.team2 { background: rgba(52, 152, 219, 0.2); border: 2px solid var(--team2); }
        .team-card.team3 { background: rgba(241, 196, 15, 0.2); border: 2px solid var(--team3); }
        .team-card.team4 { background: rgba(155, 89, 182, 0.2); border: 2px solid var(--team4); }
        .team-name { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .team-score { font-size: 48px; font-weight: 700; }
        .team-members { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }
        .team-card.winner { box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .question { font-size: 24px; margin: 24px 0; text-align: center; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .option {
            padding: 20px;
            background: var(--bg-tertiary);
            border: 3px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .option:hover { border-color: var(--accent); }
        .option.correct { border-color: var(--success); background: rgba(76, 175, 80, 0.1); }
        .option.wrong { border-color: var(--error); background: rgba(244, 67, 54, 0.1); }
        .timer { font-size: 64px; font-weight: 700; text-align: center; margin: 24px 0; }
        .progress-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }
        .lobby { text-align: center; }
        .input-group { margin: 16px 0; }
        .input {
            padding: 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 18px;
        }
        .team-input {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
        }
        .team-input .input { flex: 1; }
        .btn {
            padding: 16px 48px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-danger { background: var(--error); color: white; }
        .btn-sm { padding: 8px 16px; font-size: 14px; }
        .hidden { display: none !important; }
        .result-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .result-overlay.active { display: flex; }
        .result-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 48px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .options { grid-template-columns: 1fr; }
        }
    </style>
    <link rel="stylesheet" href="/css/modern-theme.css">
    <script src="/js/suppress-logs.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Командный режим</h1>
            <a href="/" class="btn btn-secondary">← Выход</a>
        </div>

        <!-- Lobby Screen -->
        <div class="card lobby" id="lobby">
            <h2 style="margin-bottom: 24px;">Создать командную игру</h2>

            <div style="max-width: 600px; margin: 0 auto;">
                <div class="team-input">
                    <span style="font-size: 24px;">🔴</span>
                    <input type="text" class="input" id="team1-name" placeholder="Команда 1" value="Красные">
                    <span style="font-size: 14px; color: var(--text-secondary);">
                        <input type="number" class="input" id="team1-size" value="2" min="1" max="10" style="width: 80px; padding: 8px;"> игроков
                    </span>
                </div>
                <div class="team-input">
                    <span style="font-size: 24px;">🔵</span>
                    <input type="text" class="input" id="team2-name" placeholder="Команда 2" value="Синие">
                    <span style="font-size: 14px; color: var(--text-secondary);">
                        <input type="number" class="input" id="team2-size" value="2" min="1" max="10" style="width: 80px; padding: 8px;"> игроков
                    </span>
                </div>
                <button class="btn btn-sm btn-primary" onclick="addTeam()" style="margin-bottom: 16px;">+ Добавить команду</button>

                <div id="additional-teams"></div>

                <div class="input-group">
                    <select class="input" id="category-select" style="width: 100%;">
                        <option value="">Все категории</option>
                        <option value="ethics">Этика и коммуникация</option>
                        <option value="forms_of_service">Формы обслуживания</option>
                        <option value="safety">Безопасность</option>
                        <option value="spb_specific">СПб специфика</option>
                    </select>
                </div>

                <div class="input-group">
                    <select class="input" id="questions-count" style="width: 100%;">
                        <option value="10">10 вопросов</option>
                        <option value="15">15 вопросов</option>
                        <option value="20">20 вопросов</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="startTeamGame()">🚀 Начать игру</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="hidden">
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                    <div>Вопрос <span id="question-number">1</span> из <span id="total-questions">10</span></div>
                    <div class="timer" id="timer" style="font-size: 32px; margin: 0;">30</div>
                </div>
                <div class="progress-bar" style="margin-bottom: 24px;">
                    <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                </div>
                <div class="question" id="question-text">Загрузка...</div>
                <div class="options" id="options"></div>
            </div>

            <!-- Teams Leaderboard -->
            <div class="teams-grid" id="teams-grid"></div>
        </div>

        <!-- Result Overlay -->
        <div class="result-overlay" id="result-overlay">
            <div class="result-card">
                <div style="font-size: 64px; margin-bottom: 16px;">🏆</div>
                <h2 style="font-size: 36px; margin-bottom: 8px;" id="winner-team">Победитель</h2>
                <div style="font-size: 48px; font-weight: 700; color: var(--accent);" id="winner-score">0</div>
                <div style="margin: 24px 0;" id="final-standings"></div>
                <button class="btn btn-primary" onclick="location.reload()">Реванш</button>
                <button class="btn btn-secondary" onclick="window.location.href='/'">В меню</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let teams = [];
        let questions = [];
        let currentQuestion = 0;
        let teamAnswers = [];
        let timerInterval = null;

        function addTeam() {
            const teamCount = teams.length + 3;
            if (teamCount > 4) {
                alert('Максимум 4 команды!');
                return;
            }

            const teamDiv = document.createElement('div');
            teamDiv.className = 'team-input';
            teamDiv.innerHTML = `
                <span style="font-size: 24px;">${['🟡', '🟢', '🟣'][teamCount - 3]}</span>
                <input type="text" class="input" placeholder="Команда ${teamCount}">
                <span style="font-size: 14px; color: var(--text-secondary);">
                    <input type="number" class="input" min="1" max="10" value="2" style="width: 80px; padding: 8px;"> игроков
                </span>
                <button class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('additional-teams').appendChild(teamDiv);
        }

        async function startTeamGame() {
            const teamInputs = document.querySelectorAll('.team-input');
            teams = [];

            teamInputs.forEach((input, i) => {
                const nameInput = input.querySelector('.input:nth-of-type(1)');
                const sizeInput = input.querySelector('.input:nth-of-type(2)');
                const name = nameInput.value.trim() || `Команда ${i + 1}`;
                const size = parseInt(sizeInput.value) || 2;
                teams.push({
                    id: i,
                    name: name,
                    size: size,
                    score: 0,
                    correct: 0,
                    total: 0,
                    color: ['team1', 'team2', 'team3', 'team4'][i]
                });
            });

            const category = document.getElementById('category-select').value;
            const questionsCount = parseInt(document.getElementById('questions-count').value);

            try {
                const res = await fetch(`${API_BASE}/questions?learning=true`);
                const data = await res.json();
                let allQuestions = data.questions || [];

                if (category) {
                    allQuestions = allQuestions.filter(q => q.category === category);
                }

                if (allQuestions.length < questionsCount) {
                    alert(`Недостаточно вопросов! Есть только ${allQuestions.length}, нужно ${questionsCount}.`);
                    return;
                }

                questions = shuffleArray(allQuestions).slice(0, questionsCount);

                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('total-questions').textContent = questions.length;

                renderTeamsGrid();
                showQuestion();
            } catch (error) {
                console.error('Error loading questions:', error);
            }
        }

        function renderTeamsGrid() {
            const grid = document.getElementById('teams-grid');
            grid.innerHTML = teams.map((team, i) => `
                <div class="team-card ${team.color} ${teams.findIndex(t => t.score > teams[0].score) === i && i === 0 ? 'winner' : ''}" id="team-${team.id}">
                    <div class="team-name">${team.name}</div>
                    <div class="team-score" id="team-score-${team.id}">${team.score}</div>
                    <div class="team-members">${team.size} игрок(ов)</div>
                    <div style="font-size: 14px; color: var(--text-secondary); margin-top: 8px;">
                        <span id="team-correct-${team.id}">${team.correct}</span> правильных из <span id="team-total-${team.id}">${team.total}</span>
                    </div>
                </div>
            `).join('');
        }

        function showQuestion() {
            if (currentQuestion >= questions.length) {
                endTeamGame();
                return;
            }

            const q = questions[currentQuestion];
            teamAnswers = [];

            document.getElementById('question-number').textContent = currentQuestion + 1;
            document.getElementById('question-text').textContent = q.question;

            const letters = ['А', 'Б', 'В', 'Г'];
            document.getElementById('options').innerHTML = q.options.map((opt, i) => `
                <div class="option" id="option-${i}" onclick="selectTeamAnswer(${i}, ${q.correct}, ${teams.length})">
                    <span style="font-weight: 600; margin-right: 8px;">${letters[i]}.</span>${opt}
                </div>
            `).join('');

            // Timer - 30 seconds
            let timeLeft = 30;
            document.getElementById('timer').textContent = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    processTeamResults(q.correct);
                }
            }, 1000);
        }

        function selectTeamAnswer(answer, correct, teamCount) {
            // Disable all options
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.onclick = null);

            // Collect answers from all teams (simulate team voting)
            teams.forEach(team => {
                // Simulate team consensus with some randomness
                const teamAccuracy = 0.6 + Math.random() * 0.3; // 60-90% accuracy
                const teamAnswer = Math.random() < teamAccuracy ? correct : Math.floor(Math.random() * 4);
                teamAnswers.push({
                    team: team,
                    answer: teamAnswer
                });

                // Mark team's answer on option
                const option = document.getElementById(`option-${teamAnswer}`);
                if (option) {
                    option.style.opacity = '0.7';
                }
            });

            processTeamResults(correct);
        }

        function processTeamResults(correct) {
            clearInterval(timerInterval);

            // Show correct answer
            const correctOption = document.getElementById(`option-${correct}`);
            if (correctOption) correctOption.classList.add('correct');

            // Calculate team scores
            teams.forEach(team => {
                const teamData = teamAnswers.find(t => t.team.id === team.id);
                if (!teamData) return;

                const isCorrect = teamData.answer === correct;
                team.total++;
                team.correct += isCorrect ? 1 : 0;

                // Points based on team size (smaller teams get more points per correct answer)
                const sizeBonus = Math.max(1, 5 - team.size);
                const points = isCorrect ? (100 + sizeBonus * 10) : 0;
                team.score += points;

                // Update display
                document.getElementById(`team-score-${team.id}`).textContent = team.score;
                document.getElementById(`team-correct-${team.id}`).textContent = team.correct;
                document.getElementById(`team-total-${team.id}`).textContent = team.total;
            });

            // Update progress
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            // Sort and update leaderboard
            teams.sort((a, b) => b.score - a.score);
            renderTeamsGrid();

            setTimeout(() => {
                currentQuestion++;
                showQuestion();
            }, 3000);
        }

        function endTeamGame() {
            const winner = teams[0];
            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);

            document.getElementById('winner-team').textContent = winner.name;
            document.getElementById('winner-score').textContent = `${winner.score} очков`;

            document.getElementById('final-standings').innerHTML = sortedTeams.map((team, i) => `
                <div style="display: flex; justify-content: space-between; padding: 12px; margin: 8px 0; background: var(--bg-tertiary); border-radius: 8px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <span style="font-size: 24px;">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '🎖'}</span>
                        <span style="font-weight: 600;">${team.name}</span>
                        <span style="font-size: 14px; color: var(--text-secondary);">(${team.size} игроков)</span>
                    </div>
                    <div style="font-size: 24px; font-weight: 700; color: var(--accent);">${team.score}</div>
                </div>
            `).join('');

            document.getElementById('result-overlay').classList.add('active');
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
    </script>
</body>
</html>
