<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти в зал — GLM Quiz</title>
    <link rel="stylesheet" href="/css/modern-theme.css">
    <style>
        body { min-height: 100vh; padding: 24px 16px 96px; }
        .join-card {
            max-width: 560px; margin: 0 auto;
            background: var(--paper-strong); border-radius: 24px;
            padding: 32px 24px; box-shadow: var(--shadow-soft);
        }
        h1 { font-size: 28px; margin: 0 0 8px; }
        .lead { color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        input[type="text"] {
            width: 100%; box-sizing: border-box; padding: 16px;
            font-size: 22px; letter-spacing: 4px; text-align: center;
            text-transform: uppercase; border-radius: 12px;
            border: 1px solid var(--border); background: #fff;
        }
        .btn { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 12px;
            background: var(--accent-blue); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
        .status { min-height: 1.4em; margin: 10px 0 0; color: var(--muted); font-size: 14px; }
        .status.error { color: var(--error); }
        .player-grid { display: grid; gap: 10px; margin-top: 20px; }
        .player-btn {
            display: block; padding: 16px; border-radius: 14px; text-decoration: none;
            background: #fff; border: 1px solid var(--border); color: var(--ink);
        }
        .player-btn strong { display: block; font-size: 16px; }
        .player-btn span { color: var(--muted); font-size: 13px; }
        .back { display: inline-block; margin-bottom: 16px; color: var(--accent-blue); text-decoration: none; }
    </style>
</head>
<body>
    <main class="join-card">
        <a class="back" href="/">← К викторине</a>
        <h1>Войти в зал</h1>
        <p class="lead">Введите PIN или код с экрана ведущего. Если код не найден — выберите формат вручную.</p>
        <form id="join-form">
            <label for="code">Код сессии</label>
            <input id="code" name="code" type="text" maxlength="8" autocomplete="off" inputmode="text" placeholder="НАПРИМЕР A1B2C3">
            <button class="btn" type="submit">Продолжить</button>
            <p class="status" id="status" role="status"></p>
        </form>
        <div class="player-grid">
            <a class="player-btn" href="/realtime-player.html">
                <strong>Kahoot</strong>
                <span>Живая викторина по PIN</span>
            </a>
            <a class="player-btn" href="/pulse-player.html">
                <strong>Пульс зала</strong>
                <span>Анонимный опрос без очков</span>
            </a>
            <a class="player-btn" href="/qa-player.html">
                <strong>Вопрос спикеру</strong>
                <span>Live Q&amp;A с модерацией</span>
            </a>
        </div>
    </main>
    <script>
        const statusEl = document.getElementById('status');
        const codeInput = document.getElementById('code');
        const params = new URLSearchParams(location.search);
        const preset = (params.get('code') || params.get('game') || '').trim().toUpperCase();
        if (preset) codeInput.value = preset;

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.classList.toggle('error', !!isError);
        }

        async function lookup(code) {
            const clean = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (clean.length < 4) {
                setStatus('Введите код с экрана ведущего', true);
                return;
            }
            setStatus('Ищем сессию…');
            try {
                const res = await fetch('/api/join/lookup?code=' + encodeURIComponent(clean));
                const data = await res.json();
                if (data.found && data.path) {
                    location.href = data.path;
                    return;
                }
                if (data.ambiguous) {
                    setStatus('Несколько сессий с таким кодом. Выберите формат ниже.', true);
                    return;
                }
                setStatus('Сессия не найдена. Выберите Kahoot, Пульс или Q&A ниже и введите код там.', true);
            } catch (e) {
                setStatus('Нет связи с сервером. Выберите формат вручную.', true);
            }
        }

        document.getElementById('join-form').addEventListener('submit', (event) => {
            event.preventDefault();
            lookup(codeInput.value);
        });

        if (preset) lookup(preset);
    </script>
</body>
</html>
