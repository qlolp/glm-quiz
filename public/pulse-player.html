<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульс зала — участник</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0c0c0e; color: #fff; margin: 0; min-height: 100vh; }
        .wrap { max-width: 560px; margin: 0 auto; padding: 24px; }
        h1 { font-size: 24px; }
        .sub { color: #9fa0a0; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; font-size: 22px; letter-spacing: 4px; text-align: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: #1c1c1e; color: #fff; text-transform: uppercase; box-sizing: border-box; }
        .btn { width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 12px; background: #6366f1; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; }
        .option { display: block; width: 100%; text-align: left; margin: 10px 0; padding: 14px 16px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.12); background: #141618; color: #fff; font-size: 15px; cursor: pointer; box-sizing: border-box; }
        .option:disabled { opacity: 0.7; cursor: default; }
        .option.picked { border-color: #6366f1; }
        .scale-grid { display:grid;grid-template-columns:repeat(5,1fr);gap:8px; }
        .scale-grid .option { text-align:center;padding:14px 6px; }
        .bar { height: 24px; background: #1c1c1e; border-radius: 8px; overflow: hidden; margin: 6px 0 14px; }
        .bar > span { display: block; height: 100%; background: #6366f1; }
        .hidden { display: none; }
        a { color: #a5b4fc; }
        .status { color: #9fa0a0; margin: 12px 0; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>📡 Пульс зала</h1>
        <p class="sub">Анонимный ответ. Без имени и без очков.</p>

        <div id="join-screen">
            <input id="code" maxlength="8" placeholder="КОД" autocomplete="off">
            <button class="btn" id="join-btn">Войти</button>
            <p class="status" id="join-status"></p>
        </div>

        <div id="wait-screen" class="hidden">
            <p class="status">Ожидайте вопрос от ведущего…</p>
        </div>

        <div id="ask-screen" class="hidden">
            <div id="q-text" style="font-size:18px;line-height:1.45;margin-bottom:16px;"></div>
            <div id="options"></div>
            <p class="status" id="ask-status"></p>
        </div>

        <div id="results-screen" class="hidden">
            <h2>Результаты зала</h2>
            <div id="results"></div>
            <p class="status">Ждите следующий вопрос…</p>
        </div>

        <p style="margin-top:24px;"><a href="/">← Викторина</a></p>
    </div>
    <script>
        let ws = null;
        let pulseId = sessionStorage.getItem('pulse_player_id') || null;
        // Stable per-tab identity so a reconnect re-joins instead of voting twice
        let playerToken = sessionStorage.getItem('pulse_player_token') || null;
        let answered = false;

        function show(id) {
            ['join-screen','wait-screen','ask-screen','results-screen'].forEach(s => {
                document.getElementById(s).classList.toggle('hidden', s !== id);
            });
        }

        function renderResults(data) {
            if (data.question?.kind === 'scale') {
                document.getElementById('results').innerHTML =
                    `<div style="font-size:26px;font-weight:700;margin-bottom:14px;">Среднее: ${data.mean ?? '—'}</div>` +
                    (data.distribution || []).map(d => `<div>${d.index} — <strong>${d.percent}%</strong> (${d.count})</div>
                        <div class="bar"><span style="width:${d.percent}%"></span></div>`).join('');
                show('results-screen');
                return;
            }
            const letters = ['А', 'Б', 'В', 'Г'];
            document.getElementById('results').innerHTML = (data.distribution || []).map((d, i) => {
                const label = data.question?.options?.[i] || letters[i];
                return `<div>${letters[i]}. ${label} — <strong>${d.percent}%</strong></div>
                    <div class="bar"><span style="width:${d.percent}%"></span></div>`;
            }).join('');
            show('results-screen');
        }

        function sendJoin() {
            if (!ws || ws.readyState !== WebSocket.OPEN || !pulseId) return;
            ws.send(JSON.stringify({
                type: 'pulse_join',
                pulse_id: pulseId,
                player_token: playerToken || undefined
            }));
        }

        function connect() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}`);
            ws.onmessage = (ev) => handle(JSON.parse(ev.data));
            ws.onclose = () => {
                document.getElementById('join-status').textContent = 'Соединение потеряно, переподключение…';
                setTimeout(connect, 2000);
            };
            ws.onopen = () => sendJoin();
        }

        function handle(data) {
            if (data.type === 'pulse_joined') {
                pulseId = data.pulse_id;
                sessionStorage.setItem('pulse_player_id', pulseId);
                if (data.player_token) {
                    playerToken = data.player_token;
                    sessionStorage.setItem('pulse_player_token', playerToken);
                }
                document.getElementById('join-status').textContent = '';
                // pulse_question / pulse_results follows for asking/results rooms
                if (data.state !== 'asking' && data.state !== 'results') {
                    show('wait-screen');
                }
            }
            if (data.type === 'pulse_question') {
                answered = !!data.already_answered;
                document.getElementById('q-text').textContent = data.question.text;
                const box = document.getElementById('options');
                box.innerHTML = '';
                if (data.question.kind === 'scale') {
                    box.className = 'scale-grid';
                    for (let value = data.question.scale_min; value <= data.question.scale_max; value++) {
                        const btn = document.createElement('button');
                        btn.className = 'option' + (data.answer === value ? ' picked' : '');
                        btn.textContent = value;
                        btn.onclick = () => {
                            answered = true;
                            [...box.children].forEach(b => b.classList.remove('picked'));
                            btn.classList.add('picked');
                            ws.send(JSON.stringify({ type: 'pulse_answer', pulse_id: pulseId, answer: value }));
                            document.getElementById('ask-status').textContent = 'Оценка принята. Можно изменить.';
                        };
                        box.appendChild(btn);
                    }
                    const labels = document.createElement('div');
                    labels.style.cssText = 'grid-column:1/-1;display:flex;justify-content:space-between;color:#9fa0a0;font-size:13px;';
                    const left = document.createElement('span');
                    const right = document.createElement('span');
                    left.textContent = data.question.label_min || '';
                    right.textContent = data.question.label_max || '';
                    labels.append(left, right);
                    box.appendChild(labels);
                    document.getElementById('ask-status').textContent = answered ? 'Оценка принята. Можно изменить.' : '';
                    show('ask-screen');
                    return;
                }
                box.className = '';
                const letters = ['А', 'Б', 'В', 'Г'];
                data.question.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option';
                    btn.textContent = `${letters[i]}. ${opt}`;
                    btn.onclick = () => {
                        if (answered) return;
                        answered = true;
                        btn.classList.add('picked');
                        [...box.children].forEach(b => b.disabled = true);
                        ws.send(JSON.stringify({ type: 'pulse_answer', pulse_id: pulseId, answer: i }));
                        document.getElementById('ask-status').textContent = 'Ответ принят';
                    };
                    box.appendChild(btn);
                });
                if (answered) {
                    [...box.children].forEach(b => b.disabled = true);
                }
                document.getElementById('ask-status').textContent = answered ? 'Ответ уже принят' : '';
                show('ask-screen');
            }
            if (data.type === 'pulse_answer_ack') {
                document.getElementById('ask-status').textContent = 'Ответ принят';
            }
            if (data.type === 'pulse_results') {
                renderResults(data);
            }
            if (data.type === 'pulse_host_disconnected') {
                document.getElementById('ask-status').textContent = 'Ведущий отключился, ожидайте…';
            }
            if (data.type === 'pulse_host_back') {
                document.getElementById('ask-status').textContent = '';
            }
            if (data.type === 'pulse_ended') {
                sessionStorage.removeItem('pulse_player_id');
                pulseId = null;
                show('join-screen');
                document.getElementById('join-status').textContent = 'Сессия завершена ведущим.';
            }
            if (data.type === 'error') {
                if (data.code === 'pulse_not_found') {
                    sessionStorage.removeItem('pulse_player_id');
                    pulseId = null;
                    show('join-screen');
                }
                document.getElementById('join-status').textContent = data.message;
            }
        }

        document.getElementById('join-btn').onclick = () => {
            const code = document.getElementById('code').value.trim().toUpperCase();
            if (!code) return;
            if (code !== pulseId) {
                // Different room: drop the old identity
                playerToken = null;
                sessionStorage.removeItem('pulse_player_token');
            }
            pulseId = code;
            sendJoin();
        };

        connect();
    </script>
</body>
</html>
